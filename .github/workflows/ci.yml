name: ShopPro CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-build:
    name: Backend Build & Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: |
          cd backend
          mvn clean compile -DskipTests

      - name: Package Application
        run: |
          cd backend
          mvn clean package -DskipTests

  frontend-admin-build:
    name: PC Admin Frontend Build (shoppro-admin)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: shoppro-admin/package-lock.json

      - name: Install Dependencies
        run: |
          cd shoppro-admin
          npm install

      - name: Type Check and Build
        run: |
          cd shoppro-admin
          npm run build

  frontend-app-build:
    name: Mobile App Frontend Build (shoppro-app)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: shoppro-app/package-lock.json

      - name: Install Dependencies
        run: |
          cd shoppro-app
          npm install

      - name: Type Check and Build
        run: |
          cd shoppro-app
          npm run build
