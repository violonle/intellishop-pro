<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面未找到 - ShopPro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="assets/global-styles.css">
    <style>
        .bounce-animation {
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
            60% {
                transform: translateY(-5px);
            }
        }
        
        .fade-in {
            animation: fadeIn 0.8s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full mx-auto px-6">
        <!-- 404图标 -->
        <div class="text-center mb-8 fade-in">
            <div class="inline-flex items-center justify-center w-24 h-24 bg-red-100 rounded-full mb-6 bounce-animation">
                <i class="fas fa-exclamation-triangle text-4xl text-red-500"></i>
            </div>
            
            <!-- 404标题 -->
            <h1 class="text-6xl font-bold text-gray-800 mb-4">404</h1>
            <h2 class="text-2xl font-semibold text-gray-700 mb-2">页面未找到</h2>
            <p class="text-gray-500 mb-8">抱歉，您访问的页面不存在或已被移动</p>
        </div>

        <!-- 解决方案 -->
        <div class="bg-white rounded-2xl shadow-lg p-6 mb-6 fade-in">
            <h3 class="text-lg font-semibold text-gray-800 mb-4 flex items-center">
                <i class="fas fa-lightbulb text-yellow-500 mr-2"></i>
                可能的解决方案
            </h3>
            <ul class="space-y-3 text-gray-600">
                <li class="flex items-start">
                    <i class="fas fa-check-circle text-green-500 mr-3 mt-1"></i>
                    <span>检查网址是否输入正确</span>
                </li>
                <li class="flex items-start">
                    <i class="fas fa-check-circle text-green-500 mr-3 mt-1"></i>
                    <span>尝试刷新页面</span>
                </li>
                <li class="flex items-start">
                    <i class="fas fa-check-circle text-green-500 mr-3 mt-1"></i>
                    <span>返回首页重新导航</span>
                </li>
            </ul>
        </div>

        <!-- 导航按钮 -->
        <div class="space-y-3 fade-in">
            <button onclick="goHome()" class="w-full bg-blue-600 text-white py-3 px-6 rounded-xl font-semibold hover:bg-blue-700 transition-colors flex items-center justify-center">
                <i class="fas fa-home mr-2"></i>
                返回首页
            </button>
            
            <button onclick="goBack()" class="w-full bg-gray-600 text-white py-3 px-6 rounded-xl font-semibold hover:bg-gray-700 transition-colors flex items-center justify-center">
                <i class="fas fa-arrow-left mr-2"></i>
                返回上页
            </button>
            
            <button onclick="contactHelp()" class="w-full bg-green-600 text-white py-3 px-6 rounded-xl font-semibold hover:bg-green-700 transition-colors flex items-center justify-center">
                <i class="fas fa-headset mr-2"></i>
                联系帮助
            </button>
        </div>

        <!-- 快速跳转 -->
        <div class="mt-8 fade-in">
            <h4 class="text-sm font-semibold text-gray-600 mb-3">常用页面</h4>
            <div class="grid grid-cols-2 gap-3">
                <a href="pages/leads.html" class="bg-white p-3 rounded-lg shadow hover:shadow-md transition-shadow text-center">
                    <i class="fas fa-users text-blue-500 mb-1"></i>
                    <div class="text-sm font-medium text-gray-700">线索管理</div>
                </a>
                <a href="pages/customer-list.html" class="bg-white p-3 rounded-lg shadow hover:shadow-md transition-shadow text-center">
                    <i class="fas fa-user-friends text-green-500 mb-1"></i>
                    <div class="text-sm font-medium text-gray-700">客户管理</div>
                </a>
                <a href="pages/analytics.html" class="bg-white p-3 rounded-lg shadow hover:shadow-md transition-shadow text-center">
                    <i class="fas fa-chart-bar text-purple-500 mb-1"></i>
                    <div class="text-sm font-medium text-gray-700">数据分析</div>
                </a>
                <a href="pages/ai-brain.html" class="bg-white p-3 rounded-lg shadow hover:shadow-md transition-shadow text-center">
                    <i class="fas fa-brain text-orange-500 mb-1"></i>
                    <div class="text-sm font-medium text-gray-700">AI大脑</div>
                </a>
            </div>
        </div>

        <!-- 底部信息 -->
        <div class="text-center mt-8 text-gray-400 text-sm fade-in">
            <p>如果问题持续存在，请联系技术支持</p>
            <p class="mt-1">错误代码: 404 | 页面未找到</p>
        </div>
    </div>

    <script>
        function goHome() {
            window.location.href = '/';
        }
        
        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                goHome();
            }
        }
        
        function contactHelp() {
            alert('联系帮助\n\n客服电话：400-123-4567\n客服邮箱：support@shoppro.com\n在线客服：周一至周五 9:00-18:00');
        }
        
        // 页面加载动画
        document.addEventListener('DOMContentLoaded', function() {
            const elements = document.querySelectorAll('.fade-in');
            elements.forEach((el, index) => {
                el.style.animationDelay = `${index * 0.2}s`;
            });
        });
    </script>
</body>
</html>
