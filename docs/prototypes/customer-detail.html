<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客户详情 - IntelliShop Pro</title>
    <link rel="stylesheet" href="../assets/global-styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 加载API客户端 -->
    <script src="../assets/js/api-client.js"></script>
    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/ui-components.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4640DE',
                        secondary: '#4ECDC4',
                        success: '#10B981',
                        warning: '#F59E0B',
                        danger: '#EF4444',
                    }
                }
            }
        }
    </script>
    <style>
        /* 卡片样式 */
        .card {
            @apply bg-white rounded-lg shadow-sm border border-gray-200;
        }
        .card-header {
            @apply px-6 py-4 border-b border-gray-200;
        }
        .card-body {
            @apply px-6 py-4;
        }
        
        /* 表单样式 */
        .form-input {
            @apply w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary;
        }
        .form-label {
            @apply block text-sm font-medium text-gray-700 mb-1;
        }
        
        /* 按钮样式 */
        .btn {
            @apply inline-flex items-center px-4 py-2 rounded-md font-medium transition-colors duration-200;
        }
        .btn-primary {
            @apply bg-primary text-white hover:bg-primary/90;
        }
        .btn-outline {
            @apply bg-white text-gray-700 border border-gray-300 hover:bg-gray-50;
        }
        .btn-ghost {
            @apply bg-transparent text-gray-700 hover:bg-gray-100;
        }
        .btn-sm {
            @apply px-3 py-1.5 text-sm;
        }
        
        /* 徽章样式 */
        .badge {
            @apply inline-block px-3 py-1 rounded-full text-xs font-medium;
        }
        .badge-primary {
            @apply bg-primary/10 text-primary;
        }
        .badge-secondary {
            @apply bg-secondary/10 text-secondary;
        }
        .badge-success {
            @apply bg-success/10 text-success;
        }
        .badge-warning {
            @apply bg-warning/10 text-warning;
        }
        .badge-danger {
            @apply bg-danger/10 text-danger;
        }
        
        /* 针对iframe环境的适配 */
        body {
            margin: 0;
            padding: 0;
        }
        
        main {
            @apply w-full;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- 顶部导航栏 -->
    <header class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- 左侧：返回按钮和标题 -->
                <div class="flex items-center space-x-4">
                    <button onclick="goBack()" class="text-gray-500 hover:text-gray-700 transition-colors">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                        </svg>
                    </button>
                    <div>
                        <h1 class="text-xl font-semibold text-gray-900" id="customerName">客户详情</h1>
                        <p class="text-sm text-gray-500">查看和管理客户信息</p>
                    </div>
                </div>
                
                <!-- 右侧：操作按钮 -->
                <div class="flex items-center space-x-3">
                    <button onclick="toggleEdit()" id="editBtn" class="btn btn-outline">
                        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                        </svg>
                        编辑
                    </button>
                    <button onclick="deleteCustomer()" class="btn btn-outline text-red-600 border-red-300 hover:bg-red-50">
                        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                        </svg>
                        删除
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- 主要内容区域 -->
    <main class="w-full px-4 py-6">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- 左侧：客户基本信息 -->
            <div class="lg:col-span-2 space-y-6">
                <!-- 基本信息卡片 -->
                <div class="card">
                    <div class="card-header">
                        <h3 class="text-lg font-medium text-gray-900">基本信息</h3>
                    </div>
                    <div class="card-body">
                        <form id="customerForm">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div>
                                    <label class="form-label">客户姓名 *</label>
                                    <input type="text" id="name" name="name" class="form-input" readonly>
                                </div>
                                <div>
                                    <label class="form-label">公司名称</label>
                                    <input type="text" id="company" name="company" class="form-input" readonly>
                                </div>
                                <div>
                                    <label class="form-label">联系电话 *</label>
                                    <input type="tel" id="phone" name="phone" class="form-input" readonly>
                                </div>
                                <div>
                                    <label class="form-label">邮箱地址</label>
                                    <input type="email" id="email" name="email" class="form-input" readonly>
                                </div>
                                <div>
                                    <label class="form-label">客户类型</label>
                                    <select id="type" name="type" class="form-input" disabled>
                                        <option value="individual">个人客户</option>
                                        <option value="enterprise">企业客户</option>
                                        <option value="partner">合作伙伴</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="form-label">客户状态</label>
                                    <select id="status" name="status" class="form-input" disabled>
                                        <option value="active">活跃客户</option>
                                        <option value="potential">潜在客户</option>
                                        <option value="inactive">非活跃客户</option>
                                    </select>
                                </div>
                                <div class="md:col-span-2">
                                    <label class="form-label">地址</label>
                                    <input type="text" id="address" name="address" class="form-input" readonly>
                                </div>
                                <div class="md:col-span-2">
                                    <label class="form-label">备注</label>
                                    <textarea id="notes" name="notes" rows="3" class="form-input" readonly></textarea>
                                </div>
                            </div>
                            
                            <!-- 编辑模式下的保存按钮 -->
                            <div id="editActions" class="hidden mt-6 flex justify-end space-x-3">
                                <button type="button" onclick="cancelEdit()" class="btn btn-ghost">取消</button>
                                <button type="submit" class="btn btn-primary">保存更改</button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- 联系记录 -->
                <div class="card">
                    <div class="card-header">
                        <div class="flex justify-between items-center">
                            <h3 class="text-lg font-medium text-gray-900">联系记录</h3>
                            <button onclick="addContactRecord()" class="btn btn-sm btn-primary">
                                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                                </svg>
                                添加记录
                            </button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="contactRecords" class="space-y-4">
                            <!-- 联系记录将通过JavaScript动态加载 -->
                        </div>
                    </div>
                </div>

                <!-- 订单历史 -->
                <div class="card">
                    <div class="card-header">
                        <h3 class="text-lg font-medium text-gray-900">订单历史</h3>
                    </div>
                    <div class="card-body">
                        <div class="overflow-x-auto">
                            <table class="min-w-full divide-y divide-gray-200">
                                <thead class="bg-gray-50">
                                    <tr>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">订单号</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">日期</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">金额</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">状态</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                                    </tr>
                                </thead>
                                <tbody id="orderHistory" class="bg-white divide-y divide-gray-200">
                                    <!-- 订单数据将通过JavaScript动态加载 -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右侧：客户统计和快速操作 -->
            <div class="space-y-6">
                <!-- 客户头像和基本信息 -->
                <div class="card">
                    <div class="card-body text-center">
                        <img id="customerAvatar" class="h-24 w-24 rounded-full mx-auto mb-4" src="" alt="客户头像">
                        <h4 id="customerDisplayName" class="text-xl font-semibold text-gray-900 mb-2"></h4>
                        <p id="customerDisplayCompany" class="text-gray-600 mb-4"></p>
                        <div class="flex justify-center space-x-2">
                            <span id="customerStatusBadge" class="badge"></span>
                            <span id="customerTypeBadge" class="badge"></span>
                        </div>
                    </div>
                </div>

                <!-- 客户统计 -->
                <div class="card">
                    <div class="card-header">
                        <h3 class="text-lg font-medium text-gray-900">客户统计</h3>
                    </div>
                    <div class="card-body space-y-4">
                        <div class="flex justify-between items-center">
                            <span class="text-sm text-gray-600">总订单数</span>
                            <span class="text-lg font-semibold text-gray-900" id="totalOrders">12</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-sm text-gray-600">总消费金额</span>
                            <span class="text-lg font-semibold text-gray-900" id="totalAmount">¥45,680</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-sm text-gray-600">平均订单金额</span>
                            <span class="text-lg font-semibold text-gray-900" id="avgAmount">¥3,807</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-sm text-gray-600">最后下单</span>
                            <span class="text-sm text-gray-600" id="lastOrder">2024-01-15</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-sm text-gray-600">客户价值</span>
                            <span class="badge badge-success">高价值</span>
                        </div>
                    </div>
                </div>

                <!-- 快速操作 -->
                <div class="card">
                    <div class="card-header">
                        <h3 class="text-lg font-medium text-gray-900">快速操作</h3>
                    </div>
                    <div class="card-body space-y-3">
                        <button onclick="callCustomer()" class="w-full btn btn-outline">
                            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
                            </svg>
                            拨打电话
                        </button>
                        <button onclick="sendEmail()" class="w-full btn btn-outline">
                            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                            </svg>
                            发送邮件
                        </button>
                        <button onclick="createOrder()" class="w-full btn btn-primary">
                            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
                            </svg>
                            创建订单
                        </button>
                        <button onclick="scheduleFollowUp()" class="w-full btn btn-outline">
                            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                            </svg>
                            安排跟进
                        </button>
                    </div>
                </div>

                <!-- 相关客户 -->
                <div class="card">
                    <div class="card-header">
                        <h3 class="text-lg font-medium text-gray-900">相关客户</h3>
                    </div>
                    <div class="card-body">
                        <div id="relatedCustomers" class="space-y-3">
                            <!-- 相关客户将通过JavaScript动态加载 -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 添加联系记录模态框 -->
    <div id="contactModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden z-50">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-lg shadow-xl max-w-md w-full">
                <div class="px-6 py-4 border-b border-gray-200">
                    <h3 class="text-lg font-medium text-gray-900">添加联系记录</h3>
                </div>
                <form id="contactForm" class="p-6 space-y-4">
                    <div>
                        <label class="form-label">联系方式</label>
                        <select name="method" class="form-input">
                            <option value="phone">电话</option>
                            <option value="email">邮件</option>
                            <option value="meeting">会面</option>
                            <option value="wechat">微信</option>
                        </select>
                    </div>
                    <div>
                        <label class="form-label">联系内容</label>
                        <textarea name="content" rows="4" class="form-input" placeholder="请描述联系的具体内容..."></textarea>
                    </div>
                    <div>
                        <label class="form-label">下次跟进时间</label>
                        <input type="datetime-local" name="followUpDate" class="form-input">
                    </div>
                </form>
                <div class="px-6 py-4 bg-gray-50 flex justify-end space-x-3">
                    <button type="button" onclick="closeContactModal()" class="btn btn-ghost">取消</button>
                    <button type="submit" form="contactForm" class="btn btn-primary">保存记录</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 模拟客户数据
        const customerData = {
            id: 1,
            name: '张三',
            company: '阿里巴巴集团',
            phone: '138-0013-8000',
            email: 'zhangsan@alibaba.com',
            type: 'enterprise',
            status: 'active',
            address: '浙江省杭州市余杭区文一西路969号',
            notes: '重要客户，对我们的产品很感兴趣，需要定期跟进。',
            avatar: 'https://ui-avatars.com/api/?name=张三&background=4640DE&color=fff',
            createdAt: '2023-06-15',
            lastContact: '2024-01-15'
        };

        // 模拟联系记录数据
        const contactRecords = [
            {
                id: 1,
                method: 'phone',
                content: '电话沟通产品需求，客户对新功能很感兴趣',
                date: '2024-01-15 14:30',
                followUpDate: '2024-01-20'
            },
            {
                id: 2,
                method: 'email',
                content: '发送产品报价单和技术方案',
                date: '2024-01-12 09:15',
                followUpDate: null
            },
            {
                id: 3,
                method: 'meeting',
                content: '现场演示产品功能，客户反馈良好',
                date: '2024-01-10 15:00',
                followUpDate: '2024-01-15'
            }
        ];

        // 模拟订单历史数据
        const orderHistory = [
            {
                id: 'ORD-2024-001',
                date: '2024-01-15',
                amount: 12800,
                status: 'completed'
            },
            {
                id: 'ORD-2024-002',
                date: '2024-01-10',
                amount: 8500,
                status: 'processing'
            },
            {
                id: 'ORD-2023-156',
                date: '2023-12-28',
                amount: 15600,
                status: 'completed'
            }
        ];

        // 模拟相关客户数据
        const relatedCustomers = [
            {
                id: 2,
                name: '李四',
                company: '腾讯科技',
                avatar: 'https://ui-avatars.com/api/?name=李四&background=4ECDC4&color=fff'
            },
            {
                id: 3,
                name: '王五',
                company: '字节跳动',
                avatar: 'https://ui-avatars.com/api/?name=王五&background=10B981&color=fff'
            }
        ];

        let isEditing = false;

        // 返回函数 - 支持iframe环境
        function goBack() {
            if (window.parent !== window) {
                // 在iframe中，发送消恫给父窗口
                window.parent.postMessage({ action: 'goBack' }, '*');
            } else {
                // 正常情况，使用history.back()
                history.back();
            }
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadCustomerData();
            loadContactRecords();
            loadOrderHistory();
            loadRelatedCustomers();
        });

        // 从 API 加载客户数据
        async function loadCustomerData() {
            try {
                // 从 URL 参数中获取客户 ID
                const params = new URLSearchParams(window.location.search);
                const customerId = params.get('id') || 1;
                
                // 从 API 加载客户详情
                const response = await api.customers.get(customerId);
                const customer = response.data || response;
                
                // 更新 customerData 对象
                Object.assign(customerData, customer);
                
                // 填充表单字段
                document.getElementById('name').value = customerData.name;
                document.getElementById('company').value = customerData.company;
                document.getElementById('phone').value = customerData.phone;
                document.getElementById('email').value = customerData.email;
                document.getElementById('type').value = customerData.type;
                document.getElementById('status').value = customerData.status;
                document.getElementById('address').value = customerData.address;
                document.getElementById('notes').value = customerData.notes;

                // 更新页面标题和显示信息
                document.getElementById('customerName').textContent = customerData.name;
                document.getElementById('customerDisplayName').textContent = customerData.name;
                document.getElementById('customerDisplayCompany').textContent = customerData.company;
                document.getElementById('customerAvatar').src = customerData.avatar;

                // 更新状态和类型徽章
                const statusBadge = document.getElementById('customerStatusBadge');
                statusBadge.className = `badge ${getStatusBadgeClass(customerData.status)}`;
                statusBadge.textContent = getStatusText(customerData.status);

                const typeBadge = document.getElementById('customerTypeBadge');
                typeBadge.className = `badge ${getTypeBadgeClass(customerData.type)}`;
                typeBadge.textContent = getTypeText(customerData.type);
                
            } catch (error) {
                console.error('加载客户数据失败:', error);
                // 使用本地数据作为 Fallback
                // 继续执行原有逻辑
            }
        }

        // 加载联系记录
        function loadContactRecords() {
            const container = document.getElementById('contactRecords');
            container.innerHTML = '';

            contactRecords.forEach(record => {
                const recordElement = document.createElement('div');
                recordElement.className = 'border-l-4 border-primary pl-4 py-3 bg-gray-50 rounded-r-lg';
                recordElement.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <div class="flex items-center space-x-2">
                            <span class="badge badge-primary">${getMethodText(record.method)}</span>
                            <span class="text-sm text-gray-500">${record.date}</span>
                        </div>
                        <button onclick="deleteContactRecord(${record.id})" class="text-gray-400 hover:text-red-500">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                            </svg>
                        </button>
                    </div>
                    <p class="text-sm text-gray-700 mb-2">${record.content}</p>
                    ${record.followUpDate ? `<p class="text-xs text-gray-500">下次跟进：${record.followUpDate}</p>` : ''}
                `;
                container.appendChild(recordElement);
            });
        }

        // 加载订单历史
        function loadOrderHistory() {
            const tbody = document.getElementById('orderHistory');
            tbody.innerHTML = '';

            orderHistory.forEach(order => {
                const row = document.createElement('tr');
                row.className = 'hover:bg-gray-50';
                row.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${order.id}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${order.date}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">¥${order.amount.toLocaleString()}</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="badge ${getOrderStatusBadgeClass(order.status)}">${getOrderStatusText(order.status)}</span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                        <button onclick="viewOrder('${order.id}')" class="text-primary hover:text-primary-dark">查看</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        // 加载相关客户
        function loadRelatedCustomers() {
            const container = document.getElementById('relatedCustomers');
            container.innerHTML = '';

            relatedCustomers.forEach(customer => {
                const customerElement = document.createElement('div');
                customerElement.className = 'flex items-center space-x-3 p-3 bg-gray-50 rounded-lg hover:bg-gray-100 cursor-pointer';
                customerElement.onclick = () => viewCustomer(customer.id);
                customerElement.innerHTML = `
                    <img class="h-8 w-8 rounded-full" src="${customer.avatar}" alt="${customer.name}">
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-medium text-gray-900 truncate">${customer.name}</p>
                        <p class="text-xs text-gray-500 truncate">${customer.company}</p>
                    </div>
                `;
                container.appendChild(customerElement);
            });
        }

        // 切换编辑模式
        function toggleEdit() {
            isEditing = !isEditing;
            const form = document.getElementById('customerForm');
            const editBtn = document.getElementById('editBtn');
            const editActions = document.getElementById('editActions');

            if (isEditing) {
                // 进入编辑模式
                form.querySelectorAll('input, select, textarea').forEach(field => {
                    field.removeAttribute('readonly');
                    field.removeAttribute('disabled');
                });
                editBtn.textContent = '取消编辑';
                editActions.classList.remove('hidden');
            } else {
                // 退出编辑模式
                form.querySelectorAll('input, select, textarea').forEach(field => {
                    if (field.type !== 'submit') {
                        field.setAttribute('readonly', true);
                        if (field.tagName === 'SELECT') {
                            field.setAttribute('disabled', true);
                        }
                    }
                });
                editBtn.innerHTML = `
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                    </svg>
                    编辑
                `;
                editActions.classList.add('hidden');
                loadCustomerData(); // 重新加载原始数据
            }
        }

        // 取消编辑
        function cancelEdit() {
            toggleEdit();
        }

        // 保存客户信息 - 更新为API调用
        document.getElementById('customerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const updatedData = Object.fromEntries(formData);
            
            try {
                const params = new URLSearchParams(window.location.search);
                const customerId = params.get('id') || 1;
                
                const response = await api.customers.update(customerId, updatedData);
                console.log('客户信息更新成功:', response);
                UI.showMessage('客户信息更新成功！', 'success');
                toggleEdit();
            } catch (error) {
                console.error('API错误:', error);
                UI.showMessage('信息更新失败：' + (error.message || error), 'error');
            }
        });

        // 删除客户
        function deleteCustomer() {
            if (confirm('确定要删除这个客户吗？此操作不可恢复。')) {
                alert('客户删除成功！');
                window.location.href = 'customer-management.html';
            }
        }

        // 添加联系记录
        function addContactRecord() {
            document.getElementById('contactModal').classList.remove('hidden');
        }

        // 关闭联系记录模态框
        function closeContactModal() {
            document.getElementById('contactModal').classList.add('hidden');
            document.getElementById('contactForm').reset();
        }

        // 保存联系记录
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const recordData = Object.fromEntries(formData);
            
            console.log('新联系记录:', recordData);
            alert('联系记录添加成功！');
            closeContactModal();
            // 这里应该重新加载联系记录
        });

        // 删除联系记录
        function deleteContactRecord(id) {
            if (confirm('确定要删除这条联系记录吗？')) {
                alert(`删除联系记录 ID: ${id}`);
                // 这里应该重新加载联系记录
            }
        }

        // 快速操作函数
        function callCustomer() {
            window.open(`tel:${customerData.phone}`);
        }

        function sendEmail() {
            window.open(`mailto:${customerData.email}`);
        }

        function createOrder() {
            alert('跳转到创建订单页面');
        }

        function scheduleFollowUp() {
            alert('安排跟进功能');
        }

        function viewOrder(orderId) {
            alert(`查看订单: ${orderId}`);
        }

        function viewCustomer(customerId) {
            window.location.href = `customer-detail.html?id=${customerId}`;
        }

        // 工具函数
        function getStatusBadgeClass(status) {
            switch (status) {
                case 'active': return 'badge-success';
                case 'potential': return 'badge-warning';
                case 'inactive': return 'badge-danger';
                default: return 'badge-primary';
            }
        }

        function getStatusText(status) {
            switch (status) {
                case 'active': return '活跃';
                case 'potential': return '潜在';
                case 'inactive': return '非活跃';
                default: return '未知';
            }
        }

        function getTypeBadgeClass(type) {
            switch (type) {
                case 'enterprise': return 'badge-primary';
                case 'individual': return 'badge-secondary';
                case 'partner': return 'badge-warning';
                default: return 'badge-primary';
            }
        }

        function getTypeText(type) {
            switch (type) {
                case 'enterprise': return '企业客户';
                case 'individual': return '个人客户';
                case 'partner': return '合作伙伴';
                default: return '未知';
            }
        }

        function getMethodText(method) {
            switch (method) {
                case 'phone': return '电话';
                case 'email': return '邮件';
                case 'meeting': return '会面';
                case 'wechat': return '微信';
                default: return '其他';
            }
        }

        function getOrderStatusBadgeClass(status) {
            switch (status) {
                case 'completed': return 'badge-success';
                case 'processing': return 'badge-warning';
                case 'cancelled': return 'badge-danger';
                default: return 'badge-primary';
            }
        }

        function getOrderStatusText(status) {
            switch (status) {
                case 'completed': return '已完成';
                case 'processing': return '处理中';
                case 'cancelled': return '已取消';
                default: return '未知';
            }
        }

        // 点击模态框外部关闭
        document.getElementById('contactModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeContactModal();
            }
        });
    </script>
</body>
</html>
