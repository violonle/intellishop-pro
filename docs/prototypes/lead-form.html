<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>线索表单 - IntelliSHop Pro</title>
    <link rel="stylesheet" href="../assets/global-styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4640DE',
                        secondary: '#7C3AED',
                        success: '#10B981',
                        warning: '#F59E0B',
                        danger: '#EF4444'
                    }
                }
            }
        }
    </script>
    <style>
        
        
    </style>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen">
        <!-- 顶部导航栏 -->
        <div class="bg-white px-4 py-4 border-b border-gray-100 shadow-sm">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <button onclick="history.back()" class="p-2 text-gray-600 hover:text-primary">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                        </svg>
                    </button>
                    <h1 class="text-xl font-semibold text-gray-900" id="pageTitle">新建线索</h1>
                </div>

            </div>
        </div>

        <form id="leadForm" class="space-y-4">
            <!-- 基本信息 -->
            <div class="px-4 py-4">
                <div class="bg-white rounded-xl p-4 shadow-sm border">
                    <h3 class="text-lg font-semibold text-gray-900 mb-4 flex items-center">
                        <svg class="w-5 h-5 text-primary mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                        </svg>
                        基本信息
                    </h3>

                    <div class="space-y-4">
                        <!-- 客户姓名 -->
                        <div>
                            <label for="customerName" class="block text-sm font-medium text-gray-700 mb-1">
                                客户姓名 <span class="text-danger">*</span>
                            </label>
                            <input type="text" id="customerName" name="customerName" required
                                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                                   placeholder="请输入客户姓名">
                        </div>

                        <!-- 联系方式 -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">
                                    手机号码 <span class="text-danger">*</span>
                                </label>
                                <input type="tel" id="phone" name="phone" required
                                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                                       placeholder="请输入手机号码">
                            </div>
                            <div>
                                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
                                    邮箱地址
                                </label>
                                <input type="email" id="email" name="email"
                                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                                       placeholder="请输入邮箱地址">
                            </div>
                        </div>

                        <!-- 年龄和性别 -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label for="age" class="block text-sm font-medium text-gray-700 mb-1">
                                    年龄
                                </label>
                                <input type="number" id="age" name="age" min="18" max="100"
                                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                                       placeholder="请输入年龄">
                            </div>
                            <div>
                                <label for="gender" class="block text-sm font-medium text-gray-700 mb-1">
                                    性别
                                </label>
                                <select id="gender" name="gender"
                                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                                    <option value="">请选择性别</option>
                                    <option value="male">男</option>
                                    <option value="female">女</option>
                                </select>
                            </div>
                        </div>

                        <!-- 职业和地区 -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label for="occupation" class="block text-sm font-medium text-gray-700 mb-1">
                                    职业
                                </label>
                                <input type="text" id="occupation" name="occupation"
                                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                                       placeholder="请输入职业">
                            </div>
                            <div>
                                <label for="location" class="block text-sm font-medium text-gray-700 mb-1">
                                    所在地区 <span class="text-danger">*</span>
                                </label>
                                <input type="text" id="location" name="location" required
                                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                                       placeholder="请输入所在地区">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 购车需求 -->
            <div class="px-4 pb-4">
                <div class="bg-white rounded-xl p-4 shadow-sm border">
                    <h3 class="text-lg font-semibold text-gray-900 mb-4 flex items-center">
                        <svg class="w-5 h-5 text-primary mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                        购车需求
                    </h3>

                    <div class="space-y-4">
                        <!-- 意向车型 -->
                        <div>
                            <label for="interestedModel" class="block text-sm font-medium text-gray-700 mb-1">
                                意向车型 <span class="text-danger">*</span>
                            </label>
                            <select id="interestedModel" name="interestedModel" required
                                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                                <option value="">请选择意向车型</option>
                                <option value="bmw-x5">宝马X5</option>
                                <option value="bmw-x3">宝马X3</option>
                                <option value="bmw-3series">宝马3系</option>
                                <option value="bmw-5series">宝马5系</option>
                                <option value="bmw-7series">宝马7系</option>
                                <option value="bmw-ix">宝马iX</option>
                                <option value="bmw-i4">宝马i4</option>
                                <option value="other">其他</option>
                            </select>
                        </div>

                        <!-- 预算范围 -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label for="budgetMin" class="block text-sm font-medium text-gray-700 mb-1">
                                    预算下限（万元）
                                </label>
                                <input type="number" id="budgetMin" name="budgetMin" min="0" step="0.1"
                                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                                       placeholder="请输入预算下限">
                            </div>
                            <div>
                                <label for="budgetMax" class="block text-sm font-medium text-gray-700 mb-1">
                                    预算上限（万元）
                                </label>
                                <input type="number" id="budgetMax" name="budgetMax" min="0" step="0.1"
                                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                                       placeholder="请输入预算上限">
                            </div>
                        </div>

                        <!-- 购车时间和付款方式 -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label for="purchaseTime" class="block text-sm font-medium text-gray-700 mb-1">
                                    计划购车时间
                                </label>
                                <select id="purchaseTime" name="purchaseTime"
                                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                                    <option value="">请选择购车时间</option>
                                    <option value="1month">1个月内</option>
                                    <option value="3months">3个月内</option>
                                    <option value="6months">6个月内</option>
                                    <option value="1year">1年内</option>
                                    <option value="undecided">暂未确定</option>
                                </select>
                            </div>
                            <div>
                                <label for="paymentMethod" class="block text-sm font-medium text-gray-700 mb-1">
                                    付款方式
                                </label>
                                <select id="paymentMethod" name="paymentMethod"
                                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                                    <option value="">请选择付款方式</option>
                                    <option value="cash">全款购车</option>
                                    <option value="loan">贷款购车</option>
                                    <option value="lease">融资租赁</option>
                                    <option value="undecided">暂未确定</option>
                                </select>
                            </div>
                        </div>

                        <!-- 关注重点 -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                关注重点（可多选）
                            </label>
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
                                <label class="flex items-center space-x-2">
                                    <input type="checkbox" name="concerns" value="safety" class="rounded border-gray-300 text-primary focus:ring-primary">
                                    <span class="text-sm text-gray-700">安全性能</span>
                                </label>
                                <label class="flex items-center space-x-2">
                                    <input type="checkbox" name="concerns" value="fuel" class="rounded border-gray-300 text-primary focus:ring-primary">
                                    <span class="text-sm text-gray-700">燃油经济性</span>
                                </label>
                                <label class="flex items-center space-x-2">
                                    <input type="checkbox" name="concerns" value="tech" class="rounded border-gray-300 text-primary focus:ring-primary">
                                    <span class="text-sm text-gray-700">科技配置</span>
                                </label>
                                <label class="flex items-center space-x-2">
                                    <input type="checkbox" name="concerns" value="brand" class="rounded border-gray-300 text-primary focus:ring-primary">
                                    <span class="text-sm text-gray-700">品牌价值</span>
                                </label>
                                <label class="flex items-center space-x-2">
                                    <input type="checkbox" name="concerns" value="comfort" class="rounded border-gray-300 text-primary focus:ring-primary">
                                    <span class="text-sm text-gray-700">舒适性</span>
                                </label>
                                <label class="flex items-center space-x-2">
                                    <input type="checkbox" name="concerns" value="space" class="rounded border-gray-300 text-primary focus:ring-primary">
                                    <span class="text-sm text-gray-700">空间大小</span>
                                </label>
                                <label class="flex items-center space-x-2">
                                    <input type="checkbox" name="concerns" value="appearance" class="rounded border-gray-300 text-primary focus:ring-primary">
                                    <span class="text-sm text-gray-700">外观设计</span>
                                </label>
                                <label class="flex items-center space-x-2">
                                    <input type="checkbox" name="concerns" value="price" class="rounded border-gray-300 text-primary focus:ring-primary">
                                    <span class="text-sm text-gray-700">价格优惠</span>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 线索信息 -->
            <div class="px-4 pb-4">
                <div class="bg-white rounded-xl p-4 shadow-sm border">
                    <h3 class="text-lg font-semibold text-gray-900 mb-4 flex items-center">
                        <svg class="w-5 h-5 text-primary mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                        线索信息
                    </h3>

                    <div class="space-y-4">
                        <!-- 线索来源 -->
                        <div>
                            <label for="leadSource" class="block text-sm font-medium text-gray-700 mb-1">
                                线索来源 <span class="text-danger">*</span>
                            </label>
                            <select id="leadSource" name="leadSource" required
                                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                                <option value="">请选择线索来源</option>
                                <option value="website">官网咨询</option>
                                <option value="phone">电话咨询</option>
                                <option value="showroom">展厅到访</option>
                                <option value="referral">客户推荐</option>
                                <option value="social">社交媒体</option>
                                <option value="advertising">广告投放</option>
                                <option value="exhibition">车展活动</option>
                                <option value="other">其他</option>
                            </select>
                        </div>

                        <!-- 优先级和分配 -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label for="priority" class="block text-sm font-medium text-gray-700 mb-1">
                                    优先级
                                </label>
                                <select id="priority" name="priority"
                                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                                    <option value="medium">中优先级</option>
                                    <option value="high">高优先级</option>
                                    <option value="low">低优先级</option>
                                </select>
                            </div>
                            <div>
                                <label for="assignTo" class="block text-sm font-medium text-gray-700 mb-1">
                                    分配给
                                </label>
                                <select id="assignTo" name="assignTo"
                                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                                    <option value="">请选择销售顾问</option>
                                    <option value="zhang">张经理</option>
                                    <option value="wang">王经理</option>
                                    <option value="li">李顾问</option>
                                    <option value="chen">陈顾问</option>
                                    <option value="auto">系统自动分配</option>
                                </select>
                            </div>
                        </div>

                        <!-- 客户标签 -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                客户标签（可多选）
                            </label>
                            <div class="grid grid-cols-2 md:grid-cols-3 gap-2">
                                <label class="flex items-center space-x-2">
                                    <input type="checkbox" name="tags" value="price-sensitive" class="rounded border-gray-300 text-primary focus:ring-primary">
                                    <span class="text-sm text-gray-700">价格敏感型</span>
                                </label>
                                <label class="flex items-center space-x-2">
                                    <input type="checkbox" name="tags" value="config-priority" class="rounded border-gray-300 text-primary focus:ring-primary">
                                    <span class="text-sm text-gray-700">配置优先</span>
                                </label>
                                <label class="flex items-center space-x-2">
                                    <input type="checkbox" name="tags" value="quick-decision" class="rounded border-gray-300 text-primary focus:ring-primary">
                                    <span class="text-sm text-gray-700">决策快速</span>
                                </label>
                                <label class="flex items-center space-x-2">
                                    <input type="checkbox" name="tags" value="first-car" class="rounded border-gray-300 text-primary focus:ring-primary">
                                    <span class="text-sm text-gray-700">首次购车</span>
                                </label>
                                <label class="flex items-center space-x-2">
                                    <input type="checkbox" name="tags" value="replacement" class="rounded border-gray-300 text-primary focus:ring-primary">
                                    <span class="text-sm text-gray-700">置换客户</span>
                                </label>
                                <label class="flex items-center space-x-2">
                                    <input type="checkbox" name="tags" value="business-use" class="rounded border-gray-300 text-primary focus:ring-primary">
                                    <span class="text-sm text-gray-700">商务用车</span>
                                </label>
                            </div>
                        </div>

                        <!-- 备注信息 -->
                        <div>
                            <label for="notes" class="block text-sm font-medium text-gray-700 mb-1">
                                备注信息
                            </label>
                            <textarea id="notes" name="notes" rows="4"
                                      class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent resize-none"
                                      placeholder="请输入备注信息，如客户特殊需求、沟通要点等..."></textarea>
                        </div>
                    </div>
                </div>
            </div>

            <!-- AI智能建议 -->
            <div class="px-4 pb-4">
                <div class="bg-gradient-to-r from-primary to-secondary rounded-xl p-4 text-white shadow-sm">
                    <h3 class="text-lg font-semibold mb-3 flex items-center">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
                        </svg>
                        AI智能建议
                    </h3>
                    
                    <div id="aiSuggestions" class="space-y-3">
                        <div class="bg-white bg-opacity-10 rounded-lg p-3">
                            <h4 class="font-medium mb-2">💡 填写提示</h4>
                            <p class="text-sm opacity-90">请完善客户基本信息和购车需求，AI将为您提供个性化的跟进建议和成交概率预测。</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 底部操作按钮 -->
            <div class="px-4 pb-6">
                <div class="bg-white rounded-xl p-4 shadow-sm border">
                    <div class="flex space-x-3">
                        <button type="button" onclick="history.back()" 
                                class="flex-1 px-4 py-3 bg-gray-100 text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-200 transition-colors">
                            取消
                        </button>
                        <button type="button" onclick="saveDraft()" 
                                class="flex-1 px-4 py-3 bg-warning text-white rounded-lg text-sm font-medium hover:bg-warning/90 transition-colors">
                            保存草稿
                        </button>
                        <button type="submit" 
                                class="flex-1 px-4 py-3 bg-primary text-white rounded-lg text-sm font-medium hover:bg-primary/90 transition-colors">
                            保存线索
                        </button>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <script>
        // 页面初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 检查是否为编辑模式
            const urlParams = new URLSearchParams(window.location.search);
            const leadId = urlParams.get('id');
            
            if (leadId) {
                document.getElementById('pageTitle').textContent = '编辑线索';
                loadLeadData(leadId);
            }

            // 监听表单变化，提供AI建议
            const form = document.getElementById('leadForm');
            form.addEventListener('input', debounce(updateAISuggestions, 1000));
        });

        // 加载线索数据（编辑模式）
        function loadLeadData(leadId) {
            // 模拟加载数据
            const mockData = {
                customerName: '李先生',
                phone: '13888888888',
                email: 'li@example.com',
                age: 35,
                gender: 'male',
                occupation: '企业高管',
                location: '北京朝阳',
                interestedModel: 'bmw-x5',
                budgetMin: 45,
                budgetMax: 55,
                purchaseTime: '3months',
                paymentMethod: 'loan',
                leadSource: 'website',
                priority: 'high',
                assignTo: 'zhang',
                notes: '客户对宝马品牌有较强偏好，主要用于商务接待。'
            };

            // 填充表单数据
            Object.keys(mockData).forEach(key => {
                const element = document.getElementById(key);
                if (element) {
                    element.value = mockData[key];
                }
            });

            // 填充复选框
            const concerns = ['safety', 'tech', 'brand'];
            concerns.forEach(concern => {
                const checkbox = document.querySelector(`input[name="concerns"][value="${concern}"]`);
                if (checkbox) checkbox.checked = true;
            });

            const tags = ['price-sensitive', 'config-priority', 'quick-decision'];
            tags.forEach(tag => {
                const checkbox = document.querySelector(`input[name="tags"][value="${tag}"]`);
                if (checkbox) checkbox.checked = true;
            });
        }

        // 更新AI建议
        function updateAISuggestions() {
            const formData = new FormData(document.getElementById('leadForm'));
            const customerName = formData.get('customerName');
            const interestedModel = formData.get('interestedModel');
            const budgetMin = formData.get('budgetMin');
            const budgetMax = formData.get('budgetMax');

            let suggestions = '';

            if (customerName && interestedModel) {
                suggestions += `
                    <div class="bg-white bg-opacity-10 rounded-lg p-3">
                        <h4 class="font-medium mb-2">🎯 成交概率预测</h4>
                        <p class="text-sm opacity-90">基于客户信息分析，预计成交概率为75%。建议重点关注价格谈判和产品演示。</p>
                    </div>
                `;
            }

            if (budgetMin && budgetMax) {
                suggestions += `
                    <div class="bg-white bg-opacity-10 rounded-lg p-3">
                        <h4 class="font-medium mb-2">💰 预算匹配度</h4>
                        <p class="text-sm opacity-90">客户预算与目标车型匹配度较高，建议准备多种配置方案供选择。</p>
                    </div>
                `;
            }

            if (suggestions) {
                suggestions += `
                    <div class="bg-white bg-opacity-10 rounded-lg p-3">
                        <h4 class="font-medium mb-2">📋 下一步建议</h4>
                        <ul class="text-sm opacity-90 space-y-1">
                            <li>• 24小时内进行首次电话联系</li>
                            <li>• 发送车型详细资料和价格信息</li>
                            <li>• 安排展厅看车或试驾体验</li>
                        </ul>
                    </div>
                `;
            } else {
                suggestions = `
                    <div class="bg-white bg-opacity-10 rounded-lg p-3">
                        <h4 class="font-medium mb-2">💡 填写提示</h4>
                        <p class="text-sm opacity-90">请完善客户基本信息和购车需求，AI将为您提供个性化的跟进建议和成交概率预测。</p>
                    </div>
                `;
            }

            document.getElementById('aiSuggestions').innerHTML = suggestions;
        }

        // 防抖函数
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        // 保存草稿
        function saveDraft() {
            const formData = new FormData(document.getElementById('leadForm'));
            // 这里可以保存到本地存储或发送到服务器
            localStorage.setItem('leadDraft', JSON.stringify(Object.fromEntries(formData)));
            
            // 显示保存成功提示
            showToast('草稿已保存', 'success');
        }

        // 提交表单
        function submitForm() {
            const form = document.getElementById('leadForm');
            
            if (form.checkValidity()) {
                const formData = new FormData(form);
                
                // 收集复选框数据
                const concerns = Array.from(document.querySelectorAll('input[name="concerns"]:checked')).map(cb => cb.value);
                const tags = Array.from(document.querySelectorAll('input[name="tags"]:checked')).map(cb => cb.value);
                
                formData.append('concerns', JSON.stringify(concerns));
                formData.append('tags', JSON.stringify(tags));

                // 模拟提交
                console.log('提交线索数据:', Object.fromEntries(formData));
                
                // 清除草稿
                localStorage.removeItem('leadDraft');
                
                showToast('线索保存成功', 'success');
                
                // 延迟跳转
                setTimeout(() => {
                    window.location.href = 'leads.html';
                }, 1500);
            } else {
                form.reportValidity();
                showToast('请填写必填字段', 'error');
            }
        }

        // 显示提示消息
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `fixed top-4 right-4 px-4 py-2 rounded-lg text-white z-50 ${
                type === 'success' ? 'bg-success' : 
                type === 'error' ? 'bg-danger' : 'bg-primary'
            }`;
            toast.textContent = message;
            
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        // 页面离开前检查未保存的更改
        window.addEventListener('beforeunload', function(e) {
            const form = document.getElementById('leadForm');
            const formData = new FormData(form);
            const hasData = Array.from(formData.values()).some(value => value.trim() !== '');
            
            if (hasData) {
                e.preventDefault();
                e.returnValue = '';
            }
        });
    </script>
</body>
</html>
