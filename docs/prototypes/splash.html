<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rapidly</title>
    <link rel="stylesheet" href="../assets/global-styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#133BB7',
                        grayscale: {
                            1: '#0F1621',
                            white: '#FFFFFF',
                            stockline: '#F3F3F3'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif']
                    },
                    borderRadius: {
                        '30': '30px'
                    }
                }
            }
        }
    </script>
    <style>
        .logo-container {
            position: relative;
        }
        .logo-decorative-slider {
            position: absolute;
            background: #133BB7;
            border-radius: 2px;
        }
        .slider-1 {
            width: 16px;
            height: 4px;
            top: 7px;
            right: -32px;
        }
        .slider-2 {
            width: 16px;
            height: 4px;
            top: 15px;
            right: -20px;
        }
        .button-ripple {
            position: relative;
            overflow: hidden;
        }
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: scale(0);
            animation: ripple-animation 0.6s linear;
            pointer-events: none;
        }
        @keyframes ripple-animation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }
    </style>
</head>
<body class="bg-grayscale-white font-sans">


    <!-- Main Content -->
    <div class="flex flex-col justify-center items-center min-h-screen px-6 pb-20">
        <!-- Logo Section -->
        <div class="logo-container mb-80 w-full max-w-sm">
            <img src="../assets/logo.png" alt="Rapidly" class="w-full h-auto">
        </div>

        <!-- Buttons Section -->
        <div class="w-full max-w-sm space-y-5">
            <!-- Create Account Button -->
            <button id="createAccountBtn" class="button-ripple w-full text-grayscale-white py-4 rounded-30 font-semibold text-lg transition-colors hover:opacity-90" style="background-color: #6466F1;">
                创建账户
            </button>

            <!-- Log In Button -->
            <button id="loginBtn" class="button-ripple w-full bg-grayscale-stockline text-grayscale-1 py-4 rounded-30 font-semibold text-lg border border-grayscale-stockline hover:bg-gray-100 transition-colors">
                登录
            </button>
        </div>
    </div>

    <!-- iPhone X Home Indicator -->
    <div class="fixed bottom-5 left-1/2 transform -translate-x-1/2">
        <div class="w-34 h-1.5 bg-grayscale-1 rounded-full"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Add ripple effect to buttons
            const buttons = document.querySelectorAll('.button-ripple');
            buttons.forEach(button => {
                button.addEventListener('click', function(e) {
                    const ripple = document.createElement('span');
                    const rect = this.getBoundingClientRect();
                    const size = Math.max(rect.width, rect.height);
                    const x = e.clientX - rect.left - size / 2;
                    const y = e.clientY - rect.top - size / 2;
                    
                    ripple.style.width = ripple.style.height = size + 'px';
                    ripple.style.left = x + 'px';
                    ripple.style.top = y + 'px';
                    ripple.classList.add('ripple');
                    
                    this.appendChild(ripple);
                    
                    setTimeout(() => {
                        ripple.remove();
                    }, 600);
                });
            });

            // Handle Create Account button
            const createAccountBtn = document.getElementById('createAccountBtn');
            createAccountBtn.addEventListener('click', function(e) {
                e.preventDefault();
                // Navigate to phone number input for registration
                window.location.href = 'phone.html';
            });

            // Handle Log In button
            const loginBtn = document.getElementById('loginBtn');
            loginBtn.addEventListener('click', function(e) {
                e.preventDefault();
                // Navigate to login page
                window.location.href = 'login.html';
            });
        });
    </script>
</body>
</html>
